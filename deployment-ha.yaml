apiVersion: apps/v1
kind: Deployment
metadata:
  name: subsonic-ha
  namespace: subsonic
spec:
  replicas: 3
  selector:
    matchLabels:
      app: subsonic-ha
  template:
    metadata:
      labels:
        app: subsonic-ha
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subsonic
          image: owen09897/subsonic:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4040
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: 4040
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 4040
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
      volumes:
        - name: data
          emptyDir: {}
        - name: music
          emptyDir: {}
