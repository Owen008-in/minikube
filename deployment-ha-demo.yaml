apiVersion: apps/v1
kind: Deployment
metadata:
  name: subsonic-ha
  namespace: subsonic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subsonic-ha
  template:
    metadata:
      labels:
        app: subsonic-ha
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: subsonic
          image: owen09897/subsonic:1.1
          ports:
            - containerPort: 4040
          readinessProbe:
            httpGet: { path: "/", port: 4040 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: "/", port: 4040 }
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
      volumes:
        - name: data
          emptyDir: {}
        - name: music
          emptyDir: {}
